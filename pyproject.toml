[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "genanki>=0.13.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dateutil>=2.9.0.post0",
    "spacy>=3.8.15",
    "piper-tts>=1.3.0",
    "soundfile>=0.13.1",
    "transformers>=5.0.0",
    "torch>=2.0.0",
    "sentencepiece>=0.2.0",
    "sacremoses>=0.1.1",
]

# torch defaults to CUDA wheels, which drag in several GB of nvidia-* packages
# that are dead weight on a CPU-only machine.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
